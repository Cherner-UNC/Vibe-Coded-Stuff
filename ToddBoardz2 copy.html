            selBox.appendChild(rotLine);
            selBox.appendChild(rotHandle);
            wrapper.appendChild(selBox);
          }

          if (obj.type === "sticky") {
            const card = document.createElement("div");
            card.className = "sticky-note-card w-full h-full p-3.5 flex flex-col justify-between break-words overflow-hidden rounded-xs relative";
            card.style.backgroundColor = obj.color === "transparent" ? "transparent" : obj.color;
            if (obj.color === "transparent") {
              card.style.boxShadow = "none";
              card.style.border = "1px dashed rgba(156,163,175,0.6)";
            }

            const bodyDiv = document.createElement("div");
            bodyDiv.className = "w-full flex-1 overflow-hidden whitespace-pre-wrap break-words";
            bodyDiv.style.fontFamily = getFontCSS(obj.fontFamily);
            bodyDiv.style.fontSize = `${obj.fontSize || 22}px`;
            bodyDiv.style.color = obj.textColor || "#1f2937";
            bodyDiv.style.textAlign = obj.textAlign || "left";
            bodyDiv.style.lineHeight = "1.28";
            bodyDiv.style.fontWeight = obj.fontWeight === "bold" ? "700" : "500";
            bodyDiv.style.fontStyle = obj.fontStyle === "italic" ? "italic" : "normal";
            bodyDiv.style.textDecoration = obj.textDecoration === "underline" ? "underline" : "none";
            bodyDiv.textContent = obj.text;
            card.appendChild(bodyDiv);

            // Replies count & latest snippet footer
            const replies = Array.isArray(obj.replies) ? obj.replies : [];
            const footerRow = document.createElement("div");
            footerRow.className = "mt-1.5 pt-1 border-t border-black/10 flex items-center justify-between gap-1 text-[11px]";

            const replySummaryBtn = document.createElement("button");
            replySummaryBtn.type = "button";
            replySummaryBtn.className = "flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-black/5 hover:bg-black/10 text-gray-800 font-medium truncate max-w-[78%] transition";
            replySummaryBtn.title = "View or add replies";
            if (replies.length > 0) {
              const lastReply = replies[replies.length - 1];
              replySummaryBtn.innerHTML = `<i data-lucide="message-square" class="w-3 h-3 shrink-0"></i><span class="truncate">${replies.length}: ${escapeHtml(lastReply.text)}</span>`;
            } else {
              replySummaryBtn.innerHTML = `<i data-lucide="message-square-plus" class="w-3 h-3 shrink-0"></i><span>Reply</span>`;
            }
            replySummaryBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
            replySummaryBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openReplyModal(obj.id);
            });

            footerRow.appendChild(replySummaryBtn);
            card.appendChild(footerRow);
            wrapper.appendChild(card);

            wrapper.addEventListener("dblclick", (e) => {
              e.stopPropagation();
              openStickyModal(obj);
            });
          } else if (obj.type === "shape") {
            wrapper.innerHTML = getShapeSVG(obj.shapeType, obj.stroke, obj.fill);
          } else if (obj.type === "text") {
            if (state.editingTextObjectId === obj.id) {
              mountInlineTextEditor(wrapper, obj);
            } else {
              const textBox = document.createElement("div");
              textBox.className = "w-full h-full p-2 outline-none break-words whitespace-pre-wrap leading-normal select-none overflow-hidden";
              textBox.style.fontFamily = getFontCSS(obj.fontFamily);
              textBox.style.fontSize = `${obj.fontSize || 26}px`;
              textBox.style.color = obj.textColor || "#1f2937";
              textBox.style.textAlign = obj.textAlign || "left";
              textBox.style.fontWeight = obj.fontWeight === "bold" ? "700" : "500";
              textBox.style.fontStyle = obj.fontStyle === "italic" ? "italic" : "normal";
              textBox.style.textDecoration = obj.textDecoration === "underline" ? "underline" : "none";
              textBox.textContent = obj.text || "Double-click to type";
              if (!obj.text) textBox.style.opacity = "0.5";
              wrapper.appendChild(textBox);

              wrapper.addEventListener("dblclick", (e) => {
                e.stopPropagation();
                startEditingTextObject(obj);
              });
            }
          } else if (obj.type === "image") {
            const img = document.createElement("img");
            img.src = obj.src;
            img.className = "w-full h-full object-contain pointer-events-none rounded-lg";
            wrapper.appendChild(img);
          }

          wrapper.addEventListener("pointerdown", (e) => {
            if (state.activeTool !== "select") return;
            if (state.editingTextObjectId === obj.id) return;
            e.stopPropagation();
            selectObject(obj.id);

            const handleEl = e.target.closest("[data-handle]");
            if (handleEl) {
              const handleType = handleEl.dataset.handle;
              if (handleType === "rotate") {
                initObjectRotate(e, obj);
              } else {
                initObjectResize(e, obj, handleType);
              }
            } else {
              initObjectDrag(e, obj);
            }
          });

          objectsLayer.appendChild(wrapper);
        });

        lucide.createIcons();
        updateObjectContextBar();
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function mountInlineTextEditor(wrapper, obj) {
        const editor = document.createElement("textarea");
        editor.value = obj.text || "";
        editor.placeholder = "Type here...";
        editor.className =
          "w-full h-full p-2 bg-white/90 backdrop-blur-2xs border-2 border-blue-500 rounded-lg resize-none focus:outline-none leading-normal shadow-md overflow-auto";
        editor.style.fontSize = `${obj.fontSize || 26}px`;
        editor.style.color = obj.textColor || "#1f2937";
        editor.style.textAlign = obj.textAlign || "left";
        editor.style.fontWeight = obj.fontWeight === "bold" ? "700" : "500";
        editor.style.fontStyle = obj.fontStyle === "italic" ? "italic" : "normal";
        editor.style.textDecoration = obj.textDecoration === "underline" ? "underline" : "none";
        editor.style.fontFamily = getFontCSS(obj.fontFamily);

        wrapper.appendChild(editor);

        requestAnimationFrame(() => {
          editor.focus();
          editor.setSelectionRange(editor.value.length, editor.value.length);
        });

        editor.addEventListener("pointerdown", (e) => e.stopPropagation());

        editor.addEventListener("input", () => {
          obj.text = editor.value;
        });

        editor.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
            e.preventDefault();
            obj.fontWeight = obj.fontWeight === "bold" ? "normal" : "bold";
            editor.style.fontWeight = obj.fontWeight === "bold" ? "700" : "500";
            updateObjectContextBar();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "i") {
            e.preventDefault();
            obj.fontStyle = obj.fontStyle === "italic" ? "normal" : "italic";
            editor.style.fontStyle = obj.fontStyle === "italic" ? "italic" : "normal";
            updateObjectContextBar();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "u") {
            e.preventDefault();
            obj.textDecoration = obj.textDecoration === "underline" ? "none" : "underline";
            editor.style.textDecoration = obj.textDecoration;
            updateObjectContextBar();
            return;
          }
          if (e.key === "Enter" && !e.shiftKey && obj.listMode && obj.listMode !== "none") {
            if (handleListEnterContinuation(editor, obj.listMode)) {
              e.preventDefault();
              obj.text = editor.value;
              return;
            }
          }
          if (e.key === "Escape" || ((e.ctrlKey || e.metaKey) && e.key === "Enter")) {
            e.preventDefault();
            editor.blur();
          }
        });

        editor.addEventListener("blur", () => {
          obj.text = editor.value;
          state.editingTextObjectId = null;
          pushHistory();
          renderObjects();
        });
      }

      function startEditingTextObject(obj) {
        state.editingTextObjectId = obj.id;
        state.selectedObjectId = obj.id;
        renderObjects();
      }

      function getShapeSVG(type, stroke, fill) {
        let inner = "";
        const f = fill === "transparent" ? "none" : fill;
        if (type === "circle") {
          inner = `<circle cx="50" cy="50" r="44" stroke="${stroke}" stroke-width="4" fill="${f}" />`;
        } else if (type === "square") {
          inner = `<rect x="8" y="8" width="84" height="84" rx="4" stroke="${stroke}" stroke-width="4" fill="${f}" />`;
        } else if (type === "rounded") {
          inner = `<rect x="6" y="16" width="88" height="68" rx="20" stroke="${stroke}" stroke-width="4" fill="${f}" />`;
        } else if (type === "triangle") {
          inner = `<polygon points="50,8 92,90 8,90" stroke="${stroke}" stroke-width="4" fill="${f}" stroke-linejoin="round" />`;
        } else if (type === "diamond") {
          inner = `<polygon points="50,6 94,50 50,94 6,50" stroke="${stroke}" stroke-width="4" fill="${f}" stroke-linejoin="round" />`;
        } else if (type === "arrow") {
          inner = `<path d="M10,40 H60 V20 L90,50 L60,80 V60 H10 Z" stroke="${stroke}" stroke-width="4" fill="${f}" stroke-linejoin="round" />`;
        }
        return `<svg viewBox="0 0 100 100" class="w-full h-full pointer-events-none">${inner}</svg>`;
      }

      // Selection & contextual toolbar
      function selectObject(id) {
        state.selectedObjectId = id;
        renderObjects();
      }

      function updateObjectContextBar() {
        if (!state.selectedObjectId || state.activeTool !== "select") {
          objectContextBar.classList.add("hidden");
          return;
        }
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) {
          objectContextBar.classList.add("hidden");
          return;
        }

        objectContextBar.classList.remove("hidden");

        if (obj.type === "text" || obj.type === "sticky") {
          textFormatControls.classList.remove("hidden");
          objFontFamilySelect.value = obj.fontFamily || "sans";
          objTextColorInput.value = obj.textColor || "#1f2937";

          const isBold = obj.fontWeight === "bold";
          objBoldBtn.classList.toggle("bg-white", isBold);
          objBoldBtn.classList.toggle("text-blue-600", isBold);

          const isItalic = obj.fontStyle === "italic";
          objItalicBtn.classList.toggle("bg-white", isItalic);
          objItalicBtn.classList.toggle("text-blue-600", isItalic);

          const isUnderline = obj.textDecoration === "underline";
          objUnderlineBtn.classList.toggle("bg-white", isUnderline);
          objUnderlineBtn.classList.toggle("text-blue-600", isUnderline);

          const activeAlign = obj.textAlign || "left";
          document.querySelectorAll(".obj-align-btn").forEach((btn) => {
            const match = btn.dataset.align === activeAlign;
            btn.classList.toggle("bg-white", match);
            btn.classList.toggle("text-blue-600", match);
          });

          const activeList = obj.listMode || "none";
          document.querySelectorAll(".obj-list-btn").forEach((btn) => {
            const match = btn.dataset.listMode === activeList;
            btn.classList.toggle("bg-white", match);
            btn.classList.toggle("text-blue-600", match);
          });
        } else {
          textFormatControls.classList.add("hidden");
        }

        replyStickyContextBtn.classList.toggle("hidden", obj.type !== "sticky");
        editObjBtn.classList.toggle("hidden", obj.type !== "text" && obj.type !== "sticky");
      }

      // Drag, resize & rotate
      function initObjectDrag(e, obj) {
        const startX = e.clientX;
        const startY = e.clientY;
        const origX = obj.x;
        const origY = obj.y;

        function onMove(ev) {
          const dx = (ev.clientX - startX) / state.viewport.scale;
          const dy = (ev.clientY - startY) / state.viewport.scale;
          obj.x = Math.max(-40, Math.min(origX + dx, BOARD_WIDTH - 40));
          obj.y = Math.max(-40, Math.min(origY + dy, BOARD_HEIGHT - 40));
          renderObjects();
        }

        function onUp() {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          pushHistory();
        }

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }

      function initObjectResize(e, obj, handle) {
        const startX = e.clientX;
        const startY = e.clientY;
        const origX = obj.x;
        const origY = obj.y;
        const origW = obj.width;
        const origH = obj.height;
        const origFontSize = obj.fontSize || (obj.type === "sticky" ? 22 : 26);
        const minW = obj.type === "sticky" ? 130 : 80;
        const minH = obj.type === "sticky" ? 130 : 48;

        function onMove(ev) {
          const dx = (ev.clientX - startX) / state.viewport.scale;
          const dy = (ev.clientY - startY) / state.viewport.scale;

          let newW = origW;
          let newH = origH;
          let newX = origX;
          let newY = origY;

          if (handle.includes("right")) newW = Math.max(minW, origW + dx);
          if (handle.includes("left")) {
            const candidateW = Math.max(minW, origW - dx);
            newX = origX + (origW - candidateW);
            newW = candidateW;
          }
          if (handle.includes("bottom")) newH = Math.max(minH, origH + dy);
          if (handle.includes("top")) {
            const candidateH = Math.max(minH, origH - dy);
            newY = origY + (origH - candidateH);
            newH = candidateH;
          }

          obj.x = newX;
          obj.y = newY;
          obj.width = newW;
          obj.height = newH;

          // Dynamic font scaling inside sticky notes and text boxes
          if (obj.type === "sticky" || obj.type === "text") {
            const scaleRatio = Math.sqrt((newW * newH) / (origW * origH));
            obj.fontSize = Math.max(12, Math.min(72, Math.round(origFontSize * scaleRatio)));
          }

          renderObjects();
        }

        function onUp() {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          pushHistory();
        }

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }

      function initObjectRotate(e, obj) {
        const rect = boardContainer.getBoundingClientRect();
        const centerX = rect.left + (obj.x + obj.width / 2) * state.viewport.scale;
        const centerY = rect.top + (obj.y + obj.height / 2) * state.viewport.scale;

        function onMove(ev) {
          const angleRad = Math.atan2(ev.clientY - centerY, ev.clientX - centerX);
          obj.rotation = Math.round((angleRad * 180) / Math.PI + 90);
          renderObjects();
        }

        function onUp() {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          pushHistory();
        }

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }

      // Canvas pointer events
      function getBoardCoordinates(e) {
        const rect = boardContainer.getBoundingClientRect();
        const x = (e.clientX - rect.left) / state.viewport.scale;
        const y = (e.clientY - rect.top) / state.viewport.scale;
        return {
          x: Math.max(0, Math.min(x, BOARD_WIDTH)),
          y: Math.max(0, Math.min(y, BOARD_HEIGHT))
        };
      }

      boardContainer.addEventListener("pointerdown", (e) => {
        if (state.viewport.spacePressed || e.button === 1) {
          state.viewport.isPanning = true;
          state.viewport.lastPanClientX = e.clientX;
          state.viewport.lastPanClientY = e.clientY;
          return;
        }

        const pt = getBoardCoordinates(e);
        const slide = getCurrentSlide();
        if (!slide) return;

        if (state.activeTool === "pen" || state.activeTool === "eraser") {
          state.isDrawing = true;
          state.currentStroke = {
            type: state.activeTool === "eraser" ? "eraser" : state.pen.type,
            color: state.activeTool === "eraser" ? "#ffffff" : state.pen.color,
            size: state.activeTool === "eraser" ? 32 : state.pen.size,
            points: [pt]
          };
        } else if (state.activeTool === "laser") {
          state.isDrawing = true;
          state.laserTrail.push({ x: pt.x, y: pt.y, time: Date.now() });
        } else if (state.activeTool === "text") {
          const w = 340;
          const h = 130;
          const newTextObj = {
            id: generateId(),
            type: "text",
            text: "",
            x: Math.max(16, Math.min(pt.x, BOARD_WIDTH - w - 16)),
            y: Math.max(16, Math.min(pt.y - 16, BOARD_HEIGHT - h - 16)),
            width: w,
            height: h,
            fontFamily: "sans",
            fontWeight: "normal",
            fontStyle: "normal",
            textDecoration: "none",
            listMode: "none",
            fontSize: 26,
            textColor: "#1f2937",
            textAlign: "left",
            rotation: 0
          };
          slide.objects.push(newTextObj);
          state.selectedObjectId = newTextObj.id;
          state.editingTextObjectId = newTextObj.id;
          state.activeTool = "select";
          updateToolUI();
          renderObjects();
        } else if (state.activeTool === "shape") {
          state.shapePreview = {
            startX: pt.x,
            startY: pt.y,
            currentX: pt.x,
            currentY: pt.y
          };
          state.isDrawing = true;
        } else if (state.activeTool === "select") {
          if (e.target === drawingCanvas || e.target === boardContainer || e.target === boardBackgroundLayer) {
            state.selectedObjectId = null;
            state.editingTextObjectId = null;
            renderObjects();
          }
        }
      });

      window.addEventListener("pointermove", (e) => {
        if (state.viewport.isPanning) {
          state.viewport.panX += e.clientX - state.viewport.lastPanClientX;
          state.viewport.panY += e.clientY - state.viewport.lastPanClientY;
          state.viewport.lastPanClientX = e.clientX;
          state.viewport.lastPanClientY = e.clientY;
          applyBoardTransform();
          return;
        }

        if (!state.isDrawing) return;
        const pt = getBoardCoordinates(e);

        if ((state.activeTool === "pen" || state.activeTool === "eraser") && state.currentStroke) {
          state.currentStroke.points.push(pt);
          redrawAll();
          drawStroke(drawingCtx, state.currentStroke);
        } else if (state.activeTool === "laser") {
          state.laserTrail.push({ x: pt.x, y: pt.y, time: Date.now() });
        } else if (state.activeTool === "shape" && state.shapePreview) {
          state.shapePreview.currentX = pt.x;
          state.shapePreview.currentY = pt.y;
          redrawAll();
          drawShapePreview(state.shapePreview);
        }
      });

      window.addEventListener("pointerup", () => {
        if (state.viewport.isPanning) {
          state.viewport.isPanning = false;
        }
        if (!state.isDrawing) return;
        state.isDrawing = false;

        const slide = getCurrentSlide();
        if (!slide) return;

        if ((state.activeTool === "pen" || state.activeTool === "eraser") && state.currentStroke) {
          slide.strokes.push(state.currentStroke);
          state.currentStroke = null;
          pushHistory();
          redrawAll();
        } else if (state.activeTool === "shape" && state.shapePreview) {
          const sp = state.shapePreview;
          const newShape = {
            id: generateId(),
            type: "shape",
            shapeType: state.shape.type,
            stroke: state.shape.stroke,
            fill: state.shape.fill,
            x: Math.min(sp.startX, sp.currentX),
            y: Math.min(sp.startY, sp.currentY),
            width: Math.max(30, Math.abs(sp.currentX - sp.startX)),
            height: Math.max(30, Math.abs(sp.currentY - sp.startY)),
            rotation: 0
          };
          slide.objects.push(newShape);
          state.shapePreview = null;
          state.selectedObjectId = newShape.id;
          state.activeTool = "select";
          updateToolUI();
          pushHistory();
          renderObjects();
        }
      });

      function drawShapePreview(sp) {
        const x = Math.min(sp.startX, sp.currentX);
        const y = Math.min(sp.startY, sp.currentY);
        const w = Math.max(30, Math.abs(sp.currentX - sp.startX));
        const h = Math.max(30, Math.abs(sp.currentY - sp.startY));

        overlayCtx.clearRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
        overlayCtx.save();
        overlayCtx.strokeStyle = state.shape.stroke;
        overlayCtx.lineWidth = 3;
        overlayCtx.setLineDash([6, 6]);
        if (state.shape.fill !== "transparent") {
          overlayCtx.fillStyle = state.shape.fill;
          overlayCtx.fillRect(x, y, w, h);
        }
        overlayCtx.strokeRect(x, y, w, h);
        overlayCtx.restore();
      }

      function animationLoop() {
        overlayCtx.clearRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
        if (state.laserTrail.length > 0) {
          const now = Date.now();
          state.laserTrail = state.laserTrail.filter((pt) => now - pt.time < 800);

          if (state.laserTrail.length > 1) {
            overlayCtx.save();
            for (let i = 1; i < state.laserTrail.length; i++) {
              const p1 = state.laserTrail[i - 1];
              const p2 = state.laserTrail[i];
              const alpha = Math.max(0, 1 - (now - p2.time) / 800);
              overlayCtx.beginPath();
              overlayCtx.moveTo(p1.x, p1.y);
              overlayCtx.lineTo(p2.x, p2.y);
              overlayCtx.strokeStyle = `rgba(239, 68, 68, ${alpha})`;
              overlayCtx.lineWidth = 4;
              overlayCtx.lineCap = "round";
              overlayCtx.stroke();
            }
            const last = state.laserTrail[state.laserTrail.length - 1];
            overlayCtx.beginPath();
            overlayCtx.arc(last.x, last.y, 7, 0, Math.PI * 2);
            overlayCtx.fillStyle = "#ef4444";
            overlayCtx.fill();
            overlayCtx.lineWidth = 2;
            overlayCtx.strokeStyle = "#ffffff";
            overlayCtx.stroke();
            overlayCtx.restore();
          }
        }
        requestAnimationFrame(animationLoop);
      }

      // Tool & popover controls
      document.querySelectorAll("#leftToolbar button[data-tool]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tool = btn.dataset.tool;
          if (tool === "pen") {
            penPopover.classList.toggle("hidden");
            shapePopover.classList.add("hidden");
          } else if (tool === "shape") {
            shapePopover.classList.toggle("hidden");
            penPopover.classList.add("hidden");
          } else {
            penPopover.classList.add("hidden");
            shapePopover.classList.add("hidden");
          }

          if (tool === "sticky") {
            openStickyModal();
            return;
          }
          if (tool === "image") {
            imageFileInput.click();
            return;
          }

          state.activeTool = tool;
          updateToolUI();
        });
      });

      function updateToolUI() {
        document.querySelectorAll("#leftToolbar button[data-tool]").forEach((b) => {
          b.classList.toggle("active", b.dataset.tool === state.activeTool);
        });
        if (state.activeTool !== "select") {
          state.selectedObjectId = null;
          state.editingTextObjectId = null;
          renderObjects();
        }
      }

      document.querySelectorAll(".pen-type-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".pen-type-btn").forEach((b) => {
            b.classList.remove("active", "border-blue-500", "bg-blue-50", "text-blue-600");
            b.classList.add("border-gray-200", "text-gray-700");
          });
          btn.classList.add("active", "border-blue-500", "bg-blue-50", "text-blue-600");
          btn.classList.remove("border-gray-200", "text-gray-700");
          state.pen.type = btn.dataset.penType;
        });
      });

      document.querySelectorAll(".stroke-size-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".stroke-size-btn").forEach((b) => b.classList.remove("active", "bg-white", "shadow-2xs"));
          btn.classList.add("active", "bg-white", "shadow-2xs");
          state.pen.size = Number(btn.dataset.strokeSize);
        });
      });

      document.querySelectorAll(".pen-color-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".pen-color-btn").forEach((b) => b.classList.remove("ring-2", "ring-offset-2", "ring-blue-500"));
          btn.classList.add("ring-2", "ring-offset-2", "ring-blue-500");
          state.pen.color = btn.dataset.penColor;
          activePenColorDot.style.backgroundColor = state.pen.color;
        });
      });

      document.getElementById("customPenColorInput").addEventListener("input", (e) => {
        state.pen.color = e.target.value;
        activePenColorDot.style.backgroundColor = state.pen.color;
      });

      document.querySelectorAll(".shape-type-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".shape-type-btn").forEach((b) => {
            b.classList.remove("active", "border-blue-500", "bg-blue-50", "text-blue-600");
            b.classList.add("border-gray-200", "text-gray-700");
          });
          btn.classList.add("active", "border-blue-500", "bg-blue-50", "text-blue-600");
          btn.classList.remove("border-gray-200", "text-gray-700");
          state.shape.type = btn.dataset.shapeType;
        });
      });

      document.querySelectorAll(".shape-stroke-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".shape-stroke-btn").forEach((b) => b.classList.remove("ring-2", "ring-offset-1", "ring-blue-500"));
          btn.classList.add("ring-2", "ring-offset-1", "ring-blue-500");
          state.shape.stroke = btn.dataset.shapeStroke;
        });
      });

      document.querySelectorAll(".shape-fill-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".shape-fill-btn").forEach((b) => b.classList.remove("ring-2", "ring-offset-1", "ring-blue-500"));
          btn.classList.add("ring-2", "ring-offset-1", "ring-blue-500");
          state.shape.fill = btn.dataset.shapeFill;
        });
      });

      // Sticky Note Modal
      function openStickyModal(obj = null) {
        if (obj) {
          state.sticky.editingId = obj.id;
          state.sticky.color = obj.color || "#fff475";
          state.sticky.fontFamily = obj.fontFamily || "sans";
          state.sticky.fontSize = obj.fontSize || 22;
          state.sticky.fontWeight = obj.fontWeight || "normal";
          state.sticky.fontStyle = obj.fontStyle || "normal";
          state.sticky.textDecoration = obj.textDecoration || "none";
          state.sticky.listMode = obj.listMode || "none";
          state.sticky.textAlign = obj.textAlign || "left";
          stickyTextarea.value = obj.text || "";
          stickyModalTitle.textContent = "Edit Sticky Note";
        } else {
          state.sticky.editingId = null;
          state.sticky.color = "#fff475";
          state.sticky.fontFamily = "sans";
          state.sticky.sizePreset = "medium";
          state.sticky.fontSize = SIZE_PRESETS.medium.sticky;
          state.sticky.fontWeight = "normal";
          state.sticky.fontStyle = "normal";
          state.sticky.textDecoration = "none";
          state.sticky.listMode = "none";
          state.sticky.textAlign = "left";
          stickyTextarea.value = "";
          stickyModalTitle.textContent = "Sticky Note";
        }

        stickyFontSelect.value = state.sticky.fontFamily;
        syncStickyModalControls();
        updateStickyPreview();
        stickyModal.classList.remove("hidden");
        setTimeout(() => stickyTextarea.focus(), 40);
      }

      function syncStickyModalControls() {
        document.querySelectorAll(".sticky-color-swatch").forEach((b) => {
          const active = b.dataset.stickyColor === state.sticky.color;
          b.classList.toggle("border-2", active);
          b.classList.toggle("border-gray-800", active);
          b.classList.toggle("scale-110", active);
          b.classList.toggle("border", !active);
          b.classList.toggle("border-gray-300", !active);
        });

        document.querySelectorAll(".sticky-size-btn").forEach((b) => {
          const active = b.dataset.stickySize === state.sticky.sizePreset;
          b.classList.toggle("bg-blue-50", active);
          b.classList.toggle("text-blue-600", active);
        });

        stickyBoldBtn.classList.toggle("bg-blue-50", state.sticky.fontWeight === "bold");
        stickyBoldBtn.classList.toggle("text-blue-600", state.sticky.fontWeight === "bold");
        stickyItalicBtn.classList.toggle("bg-blue-50", state.sticky.fontStyle === "italic");
        stickyItalicBtn.classList.toggle("text-blue-600", state.sticky.fontStyle === "italic");
        stickyUnderlineBtn.classList.toggle("bg-blue-50", state.sticky.textDecoration === "underline");
        stickyUnderlineBtn.classList.toggle("text-blue-600", state.sticky.textDecoration === "underline");

        document.querySelectorAll(".sticky-list-btn").forEach((b) => {
          const active = b.dataset.stickyList === state.sticky.listMode;
          b.classList.toggle("bg-blue-50", active);
          b.classList.toggle("text-blue-600", active);
        });

        document.querySelectorAll(".sticky-align-btn").forEach((b) => {
          const active = b.dataset.stickyAlign === state.sticky.textAlign;
          b.classList.toggle("bg-blue-50", active);
          b.classList.toggle("text-blue-600", active);
        });
      }

      function updateStickyPreview() {
        stickyPreviewCard.style.backgroundColor = state.sticky.color === "transparent" ? "#ffffff" : state.sticky.color;
        stickyTextarea.style.fontFamily = getFontCSS(state.sticky.fontFamily);
        stickyTextarea.style.fontSize = `${state.sticky.fontSize}px`;
        stickyTextarea.style.fontWeight = state.sticky.fontWeight === "bold" ? "700" : "500";
        stickyTextarea.style.fontStyle = state.sticky.fontStyle === "italic" ? "italic" : "normal";
        stickyTextarea.style.textDecoration = state.sticky.textDecoration;
        stickyTextarea.style.textAlign = state.sticky.textAlign || "left";
      }

      document.querySelectorAll(".sticky-color-swatch").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.sticky.color = btn.dataset.stickyColor;
          syncStickyModalControls();
          updateStickyPreview();
        });
      });

      stickyFontSelect.addEventListener("change", (e) => {
        state.sticky.fontFamily = e.target.value;
        updateStickyPreview();
      });

      document.querySelectorAll(".sticky-size-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const preset = btn.dataset.stickySize;
          state.sticky.sizePreset = preset;
          state.sticky.fontSize = SIZE_PRESETS[preset].sticky;
          syncStickyModalControls();
          updateStickyPreview();
        });
      });

      stickyBoldBtn.addEventListener("click", () => {
        state.sticky.fontWeight = state.sticky.fontWeight === "bold" ? "normal" : "bold";
        syncStickyModalControls();
        updateStickyPreview();
      });

      stickyItalicBtn.addEventListener("click", () => {
        state.sticky.fontStyle = state.sticky.fontStyle === "italic" ? "normal" : "italic";
        syncStickyModalControls();
        updateStickyPreview();
      });

      stickyUnderlineBtn.addEventListener("click", () => {
        state.sticky.textDecoration = state.sticky.textDecoration === "underline" ? "none" : "underline";
        syncStickyModalControls();
        updateStickyPreview();
      });

      document.querySelectorAll(".sticky-list-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.dataset.stickyList;
          state.sticky.listMode = state.sticky.listMode === mode ? "none" : mode;
          stickyTextarea.value = formatTextAsList(stickyTextarea.value, state.sticky.listMode);
          syncStickyModalControls();
          stickyTextarea.focus();
        });
      });

      document.querySelectorAll(".sticky-align-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.sticky.textAlign = btn.dataset.stickyAlign;
          syncStickyModalControls();
          updateStickyPreview();
        });
      });

      stickyTextarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && state.sticky.listMode !== "none") {
          if (handleListEnterContinuation(stickyTextarea, state.sticky.listMode)) {
            e.preventDefault();
          }
        }
      });

      saveStickyBtn.addEventListener("click", () => {
        const text = stickyTextarea.value.trimEnd();
        if (!text.trim()) {
          showToast("Please type something for the sticky note.");
          return;
        }
        const slide = getCurrentSlide();
        if (!slide) return;

        if (state.sticky.editingId) {
          const obj = slide.objects.find((o) => o.id === state.sticky.editingId);
          if (obj) {
            obj.text = text;
            obj.color = state.sticky.color;
            obj.fontFamily = state.sticky.fontFamily;
            obj.fontSize = state.sticky.fontSize;
            obj.fontWeight = state.sticky.fontWeight;
            obj.fontStyle = state.sticky.fontStyle;
            obj.textDecoration = state.sticky.textDecoration;
            obj.listMode = state.sticky.listMode;
            obj.textAlign = state.sticky.textAlign;
          }
        } else {
          const count = slide.objects.filter((o) => o.type === "sticky").length % 6;
          const newSticky = {
            id: generateId(),
            type: "sticky",
            text,
            color: state.sticky.color,
            fontFamily: state.sticky.fontFamily,
            fontSize: state.sticky.fontSize,
            fontWeight: state.sticky.fontWeight,
            fontStyle: state.sticky.fontStyle,
            textDecoration: state.sticky.textDecoration,
            listMode: state.sticky.listMode,
            textAlign: state.sticky.textAlign || "left",
            x: 160 + count * 24,
            y: 140 + count * 24,
            width: 220,
            height: 220,
            textColor: "#1f2937",
            rotation: Number((Math.random() * 4 - 2).toFixed(1)),
            replies: []
          };
          slide.objects.push(newSticky);
          state.selectedObjectId = newSticky.id;
          state.activeTool = "select";
          updateToolUI();
        }

        stickyModal.classList.add("hidden");
        pushHistory();
        renderObjects();
        showToast("Sticky note saved");
      });

      cancelStickyBtn.addEventListener("click", () => stickyModal.classList.add("hidden"));
      closeStickyModalBtn.addEventListener("click", () => stickyModal.classList.add("hidden"));

      // Sticky Note Replies Modal
      function openReplyModal(stickyId) {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === stickyId && o.type === "sticky");
        if (!obj) return;
        state.replyingStickyId = stickyId;
        if (!Array.isArray(obj.replies)) obj.replies = [];

        replyParentNotePreview.style.backgroundColor = obj.color === "transparent" ? "#fff475" : obj.color;
        replyParentNotePreview.textContent = obj.text;
        renderRepliesList(obj);
        replyModal.classList.remove("hidden");
        setTimeout(() => replyInput.focus(), 40);
      }

      function renderRepliesList(obj) {
        repliesListContainer.innerHTML = "";
        const replies = obj.replies || [];
        if (replies.length === 0) {
          repliesListContainer.innerHTML = '<div class="text-xs text-gray-400 text-center py-4">No replies yet. Add the first reply below.</div>';
          return;
        }
        replies.forEach((rep) => {
          const item = document.createElement("div");
          item.className = "bg-gray-50 border border-gray-200/80 rounded-2xl px-3.5 py-2 flex items-start justify-between gap-2";
          item.innerHTML = `
            <div class="min-w-0 flex-1">
              <div class="text-xs text-gray-800 break-words whitespace-pre-wrap">${escapeHtml(rep.text)}</div>
              <div class="text-[10px] text-gray-400 mt-0.5">${escapeHtml(rep.time || "")}</div>
            </div>
            <button type="button" class="delete-reply-btn p-1 rounded-full hover:bg-red-50 text-gray-400 hover:text-red-600 transition shrink-0" title="Delete reply">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          `;
          item.querySelector(".delete-reply-btn").addEventListener("click", () => {
            obj.replies = obj.replies.filter((r) => r.id !== rep.id);
            pushHistory();
            renderRepliesList(obj);
            renderObjects();
          });
          repliesListContainer.appendChild(item);
        });
        lucide.createIcons();
      }

      replyForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = replyInput.value.trim();
        if (!text || !state.replyingStickyId) return;
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.replyingStickyId);
        if (!obj) return;
        if (!Array.isArray(obj.replies)) obj.replies = [];

        const nowTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        obj.replies.push({
          id: generateId(),
          text,
          time: nowTime
        });
        replyInput.value = "";
        pushHistory();
        renderRepliesList(obj);
        renderObjects();
      });

      closeReplyModalBtn.addEventListener("click", () => {
        replyModal.classList.add("hidden");
        state.replyingStickyId = null;
      });

      // Image upload
      imageFileInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.onload = function () {
            let w = img.width;
            let h = img.height;
            const maxDim = 360;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const slide = getCurrentSlide();
            if (!slide) return;
            const newImgObj = {
              id: generateId(),
              type: "image",
              src: event.target.result,
              x: (BOARD_WIDTH - w) / 2,
              y: (BOARD_HEIGHT - h) / 2,
              width: w,
              height: h,
              rotation: 0
            };
            slide.objects.push(newImgObj);
            state.selectedObjectId = newImgObj.id;
            state.activeTool = "select";
            updateToolUI();
            pushHistory();
            renderObjects();
            showToast("Image added");
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        imageFileInput.value = "";
      });

      // Context toolbar formatting actions
      objFontFamilySelect.addEventListener("change", (e) => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        obj.fontFamily = e.target.value;
        if (!state.editingTextObjectId) pushHistory();
        renderObjects();
      });

      document.querySelectorAll(".obj-size-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slide = getCurrentSlide();
          const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
          if (!obj) return;
          const preset = btn.dataset.sizePreset;
          obj.fontSize = obj.type === "sticky" ? SIZE_PRESETS[preset].sticky : SIZE_PRESETS[preset].text;
          if (!state.editingTextObjectId) pushHistory();
          renderObjects();
        });
      });

      objBoldBtn.addEventListener("pointerdown", (e) => e.preventDefault());
      objBoldBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        obj.fontWeight = obj.fontWeight === "bold" ? "normal" : "bold";
        if (!state.editingTextObjectId) pushHistory();
        renderObjects();
      });

      objItalicBtn.addEventListener("pointerdown", (e) => e.preventDefault());
      objItalicBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        obj.fontStyle = obj.fontStyle === "italic" ? "normal" : "italic";
        if (!state.editingTextObjectId) pushHistory();
        renderObjects();
      });

      objUnderlineBtn.addEventListener("pointerdown", (e) => e.preventDefault());
      objUnderlineBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        obj.textDecoration = obj.textDecoration === "underline" ? "none" : "underline";
        if (!state.editingTextObjectId) pushHistory();
        renderObjects();
      });

      document.querySelectorAll(".obj-list-btn").forEach((btn) => {
        btn.addEventListener("pointerdown", (e) => e.preventDefault());
        btn.addEventListener("click", () => {
          const slide = getCurrentSlide();
          const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
          if (!obj) return;
          const mode = btn.dataset.listMode;
          obj.listMode = obj.listMode === mode ? "none" : mode;
          obj.text = formatTextAsList(obj.text, obj.listMode);
          if (!state.editingTextObjectId) pushHistory();
          renderObjects();
        });
      });

      document.querySelectorAll(".obj-align-btn").forEach((btn) => {
        btn.addEventListener("pointerdown", (e) => e.preventDefault());
        btn.addEventListener("click", () => {
          const slide = getCurrentSlide();
          const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
          if (!obj) return;
          obj.textAlign = btn.dataset.align;
          if (!state.editingTextObjectId) pushHistory();
          renderObjects();
        });
      });

      document.querySelectorAll(".obj-text-color-swatch").forEach((swatch) => {
        swatch.addEventListener("click", () => {
          const slide = getCurrentSlide();
          const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
          if (!obj) return;
          obj.textColor = swatch.dataset.textColor;
          objTextColorInput.value = obj.textColor;
          if (!state.editingTextObjectId) pushHistory();
          renderObjects();
        });
      });

      objTextColorInput.addEventListener("input", (e) => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        obj.textColor = e.target.value;
        if (!state.editingTextObjectId) pushHistory();
        renderObjects();
      });

      replyStickyContextBtn.addEventListener("click", () => {
        if (state.selectedObjectId) openReplyModal(state.selectedObjectId);
      });

      editObjBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        if (obj.type === "sticky") openStickyModal(obj);
        else if (obj.type === "text") startEditingTextObject(obj);
      });

      duplicateObjBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        const obj = slide && slide.objects.find((o) => o.id === state.selectedObjectId);
        if (!obj) return;
        const copy = JSON.parse(JSON.stringify(obj));
        copy.id = generateId();
        copy.x = Math.min(BOARD_WIDTH - 80, copy.x + 24);
        copy.y = Math.min(BOARD_HEIGHT - 80, copy.y + 24);
        slide.objects.push(copy);
        state.selectedObjectId = copy.id;
        pushHistory();
        renderObjects();
        showToast("Duplicated");
      });

      bringFrontBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        if (!slide || !state.selectedObjectId) return;
        const idx = slide.objects.findIndex((o) => o.id === state.selectedObjectId);
        if (idx !== -1) {
          const [obj] = slide.objects.splice(idx, 1);
          slide.objects.push(obj);
          pushHistory();
          renderObjects();
        }
      });

      sendBackBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        if (!slide || !state.selectedObjectId) return;
        const idx = slide.objects.findIndex((o) => o.id === state.selectedObjectId);
        if (idx > 0) {
          const [obj] = slide.objects.splice(idx, 1);
          slide.objects.unshift(obj);
          pushHistory();
          renderObjects();
        }
      });

      deleteObjBtn.addEventListener("click", deleteSelectedObject);

      function deleteSelectedObject() {
        const slide = getCurrentSlide();
        if (!slide || !state.selectedObjectId) return;
        slide.objects = slide.objects.filter((o) => o.id !== state.selectedObjectId);
        state.selectedObjectId = null;
        renderObjects();
        pushHistory();
      }

      // Multi-slide navigation & drawer
      function addNewSlide() {
        state.slides.splice(state.currentSlideIndex + 1, 0, createEmptySlide());
        state.currentSlideIndex++;
        updateSlideUI();
        if (!slideOverviewBar.classList.contains("hidden")) {
          renderSlideThumbnails();
        }
        showToast(`Added Slide ${state.currentSlideIndex + 1}`);
      }

      prevSlideBtn.addEventListener("click", () => {
        if (state.currentSlideIndex > 0) {
          state.currentSlideIndex--;
          updateSlideUI();
        }
      });

      nextSlideBtn.addEventListener("click", () => {
        if (state.currentSlideIndex < state.slides.length - 1) {
          state.currentSlideIndex++;
          updateSlideUI();
        }
      });

      addSlideBtn.addEventListener("click", addNewSlide);
      overviewAddSlideBtn.addEventListener("click", addNewSlide);

      function updateSlideUI() {
        slideIndicator.textContent = `Slide ${state.currentSlideIndex + 1} / ${state.slides.length}`;
        prevSlideBtn.disabled = state.currentSlideIndex === 0;
        nextSlideBtn.disabled = state.currentSlideIndex === state.slides.length - 1;
        state.selectedObjectId = null;
        state.editingTextObjectId = null;
        redrawAll();
        updateHistoryButtons();
      }

      slideOverviewBtn.addEventListener("click", () => {
        renderSlideThumbnails();
        slideOverviewBar.classList.toggle("hidden");
      });

      closeOverviewBtn.addEventListener("click", () => {
        slideOverviewBar.classList.add("hidden");
      });

      function renderSlideThumbnails() {
        slideThumbnailsList.innerHTML = "";
        state.slides.forEach((slide, idx) => {
          const card = document.createElement("div");
          const isActive = idx === state.currentSlideIndex;
          card.className = `relative flex-shrink-0 w-44 h-24 rounded-2xl border-2 bg-white cursor-pointer overflow-hidden shadow-sm transition ${
            isActive ? "border-amber-500 ring-2 ring-amber-400/30" : "border-gray-200 hover:border-gray-300"
          }`;

          const label = document.createElement("div");
          label.className = "absolute inset-0 flex flex-col items-center justify-center text-xs font-semibold text-gray-500 pointer-events-none";
          label.innerHTML = `<span>Slide ${idx + 1}</span><span class="text-[10px] font-normal text-gray-400 mt-0.5">${slide.objects.length} items</span>`;
          card.appendChild(label);

          if (state.slides.length > 1) {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-white/90 hover:bg-red-50 text-gray-500 hover:text-red-600 flex items-center justify-center shadow-2xs transition";
            delBtn.title = "Delete slide";
            delBtn.innerHTML = '<i data-lucide="trash-2" class="w-3 h-3"></i>';
            delBtn.addEventListener("click", (ev) => {
              ev.stopPropagation();
              state.slides.splice(idx, 1);
              if (state.currentSlideIndex >= state.slides.length) {
                state.currentSlideIndex = state.slides.length - 1;
              }
              updateSlideUI();
              renderSlideThumbnails();
              showToast("Slide removed");
            });
            card.appendChild(delBtn);
          }

          card.addEventListener("click", () => {
            state.currentSlideIndex = idx;
            slideOverviewBar.classList.add("hidden");
            updateSlideUI();
          });

          slideThumbnailsList.appendChild(card);
        });
        lucide.createIcons();
      }

      // Zoom & background popovers
      zoomMenuBtn.addEventListener("click", () => {
        zoomPopover.classList.toggle("hidden");
        bgPopover.classList.add("hidden");
      });

      zoomPopover.querySelectorAll("button[data-zoom]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const action = btn.dataset.zoom;
          if (action === "in") {
            state.viewport.scale = Math.min(2.5, Number((state.viewport.scale + 0.15).toFixed(2)));
            applyBoardTransform();
          } else if (action === "out") {
            state.viewport.scale = Math.max(0.3, Number((state.viewport.scale - 0.15).toFixed(2)));
            applyBoardTransform();
          } else {
            updateViewportTransform();
          }
          zoomPopover.classList.add("hidden");
        });
      });

      bgMenuBtn.addEventListener("click", () => {
        bgPopover.classList.toggle("hidden");
        zoomPopover.classList.add("hidden");
      });

      bgPopover.querySelectorAll("button[data-bg]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slide = getCurrentSlide();
          if (!slide) return;
          slide.background = btn.dataset.bg;
          bgPopover.classList.add("hidden");
          redrawAll();
          pushHistory();
          showToast(`Background: ${btn.textContent.trim()}`);
        });
      });

      // Clear slide modal
      clearFrameBtn.addEventListener("click", () => {
        document.getElementById("clearConfirmModal").classList.remove("hidden");
      });

      document.getElementById("cancelClearBtn").addEventListener("click", () => {
        document.getElementById("clearConfirmModal").classList.add("hidden");
      });

      document.getElementById("confirmClearBtn").addEventListener("click", () => {
        const slide = getCurrentSlide();
        if (slide) {
          slide.strokes = [];
          slide.objects = [];
          state.selectedObjectId = null;
          state.editingTextObjectId = null;
          pushHistory();
          redrawAll();
        }
        document.getElementById("clearConfirmModal").classList.add("hidden");
        showToast("Slide cleared");
      });

      // Export PNG
      function drawExportBackgroundPattern(ctx, bgType) {
        ctx.save();
        if (bgType === "dots") {
          ctx.fillStyle = "#9ca3af";
          for (let x = 12; x < BOARD_WIDTH; x += 24) {
            for (let y = 12; y < BOARD_HEIGHT; y += 24) {
              ctx.beginPath();
              ctx.arc(x, y, 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else if (bgType === "ruled") {
          ctx.strokeStyle = "#e5e7eb";
          ctx.lineWidth = 1;
          for (let y = 32; y < BOARD_HEIGHT; y += 32) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(BOARD_WIDTH, y);
            ctx.stroke();
          }
        } else if (bgType === "graph") {
          ctx.strokeStyle = "#e5e7eb";
          ctx.lineWidth = 1;
          for (let x = 0; x <= BOARD_WIDTH; x += 24) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, BOARD_HEIGHT);
            ctx.stroke();
          }
          for (let y = 0; y <= BOARD_HEIGHT; y += 24) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(BOARD_WIDTH, y);
            ctx.stroke();
          }
        } else if (bgType === "isometric") {
          ctx.strokeStyle = "#cbd5e1";
          ctx.lineWidth = 1;
          const tan60 = Math.tan((60 * Math.PI) / 180);
          const stepX = 23;
          for (let x = -BOARD_HEIGHT / tan60; x <= BOARD_WIDTH + BOARD_HEIGHT / tan60; x += stepX) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + BOARD_HEIGHT / tan60, BOARD_HEIGHT);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x - BOARD_HEIGHT / tan60, BOARD_HEIGHT);
            ctx.stroke();
          }
        } else if (bgType === "tbz") {
          ctx.font = "italic 700 22px 'Kalam', 'Comic Neue', cursive";
          ctx.fillStyle = "rgba(156, 163, 175, 0.45)";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (let x = 55; x <= BOARD_WIDTH + 55; x += 110) {
            for (let y = 32; y <= BOARD_HEIGHT + 32; y += 64) {
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate((-12 * Math.PI) / 180);
              ctx.fillText("TBZ", 0, 0);
              ctx.restore();
            }
          }
        }
        ctx.restore();
      }

      function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, underline) {
        if (!text) return;
        const paragraphs = String(text).split("\n");
        const lines = [];
        paragraphs.forEach((paragraph) => {
          const words = paragraph.split(" ");
          let currentLine = words[0] || "";
          for (let i = 1; i < words.length; i++) {
            const word = words[i];
            const width = ctx.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
              currentLine += " " + word;
            } else {
              lines.push(currentLine);
              currentLine = word;
            }
          }
          lines.push(currentLine);
        });

        const totalHeight = lines.length * lineHeight;
        let startY = y - totalHeight / 2 + lineHeight / 2;
        if (ctx.textBaseline === "top") startY = y;

        lines.forEach((line, index) => {
          const ly = startY + index * lineHeight;
          ctx.fillText(line, x, ly);
          if (underline && line) {
            const textW = ctx.measureText(line).width;
            let ux = x;
            if (ctx.textAlign === "center") ux = x - textW / 2;
            else if (ctx.textAlign === "right") ux = x - textW;
            ctx.save();
            ctx.strokeStyle = ctx.fillStyle;
            ctx.lineWidth = Math.max(1.5, lineHeight * 0.05);
            ctx.beginPath();
            ctx.moveTo(ux, ly + lineHeight * 0.35);
            ctx.lineTo(ux + textW, ly + lineHeight * 0.35);
            ctx.stroke();
            ctx.restore();
          }
        });
      }

      exportPngBtn.addEventListener("click", () => {
        const slide = getCurrentSlide();
        if (!slide) return;

        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = BOARD_WIDTH;
        exportCanvas.height = BOARD_HEIGHT;
        const eCtx = exportCanvas.getContext("2d");

        eCtx.fillStyle = "#ffffff";
        eCtx.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
        drawExportBackgroundPattern(eCtx, slide.background);

        slide.strokes.forEach((s) => drawStroke(eCtx, s));

        slide.objects.forEach((obj) => {
          eCtx.save();
          eCtx.translate(obj.x + obj.width / 2, obj.y + obj.height / 2);
          eCtx.rotate(((obj.rotation || 0) * Math.PI) / 180);
          eCtx.translate(-obj.width / 2, -obj.height / 2);

          if (obj.type === "sticky") {
            if (obj.color !== "transparent") {
              eCtx.shadowColor = "rgba(0,0,0,0.16)";
              eCtx.shadowBlur = 12;
              eCtx.shadowOffsetY = 5;
              eCtx.fillStyle = obj.color;
              eCtx.fillRect(0, 0, obj.width, obj.height);
              eCtx.shadowColor = "transparent";
            }
            const fontSize = obj.fontSize || 22;
            const align = obj.textAlign || "left";
            const anchorX = align === "center" ? obj.width / 2 : align === "right" ? obj.width - 14 : 14;
            eCtx.fillStyle = obj.textColor || "#1f2937";
            eCtx.font = getCanvasFont(obj, fontSize);
            eCtx.textAlign = align;
            eCtx.textBaseline = "middle";
            wrapCanvasText(
              eCtx,
              obj.text,
              anchorX,
              obj.height / 2,
              obj.width - 28,
              fontSize * 1.25,
              obj.textDecoration === "underline"
            );

            const replies = Array.isArray(obj.replies) ? obj.replies : [];
            if (replies.length > 0) {
              eCtx.font = "600 11px Inter, sans-serif";
              eCtx.fillStyle = "rgba(31, 41, 55, 0.75)";
              eCtx.textAlign = "left";
              eCtx.textBaseline = "bottom";
              eCtx.fillText(`Replies (${replies.length}): ${replies[replies.length - 1].text}`, 12, obj.height - 8);
            }
          } else if (obj.type === "text") {
            const fontSize = obj.fontSize || 26;
            const align = obj.textAlign || "left";
            const anchorX = align === "center" ? obj.width / 2 : align === "right" ? obj.width - 8 : 8;
            eCtx.fillStyle = obj.textColor || "#1f2937";
            eCtx.font = getCanvasFont(obj, fontSize);
            eCtx.textAlign = align;
            eCtx.textBaseline = "top";
            wrapCanvasText(
              eCtx,
              obj.text,
              anchorX,
              8,
              obj.width - 16,
              fontSize * 1.25,
              obj.textDecoration === "underline"
            );
          }
          eCtx.restore();
        });

        const titleInput = document.getElementById("jamTitleInput");
        const baseName = (titleInput && titleInput.value.trim()) || "Name this ToddBoard";
        const link = document.createElement("a");
        link.download = `${baseName}-Slide-${state.currentSlideIndex + 1}.png`;
        link.href = exportCanvas.toDataURL("image/png");
        link.click();
        showToast("Exported slide as PNG");
      });

      undoBtn.addEventListener("click", undo);
      redoBtn.addEventListener("click", redo);

      window.addEventListener("resize", updateViewportTransform);

      window.addEventListener("keydown", (e) => {
        const activeTag = document.activeElement && document.activeElement.tagName;
        if (activeTag && ["INPUT", "TEXTAREA", "SELECT"].includes(activeTag)) return;

        if (e.key === " ") {
          state.viewport.spacePressed = true;
          boardContainer.style.cursor = "grab";
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
          e.preventDefault();
          redo();
          return;
        }
        if ((e.key === "Delete" || e.key === "Backspace") && state.selectedObjectId) {
          e.preventDefault();
          deleteSelectedObject();
          return;
        }
        const key = e.key.toLowerCase();
        if (key === "p") { state.activeTool = "pen"; updateToolUI(); }
        else if (key === "e") { state.activeTool = "eraser"; updateToolUI(); }
        else if (key === "v") { state.activeTool = "select"; updateToolUI(); }
        else if (key === "s") { openStickyModal(); }
        else if (key === "t") { state.activeTool = "text"; updateToolUI(); }
        else if (key === "l") { state.activeTool = "laser"; updateToolUI(); }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === " ") {
          state.viewport.spacePressed = false;
          state.viewport.isPanning = false;
          boardContainer.style.cursor = "default";
        }
      });

      function initApp() {
        state.slides.push(createEmptySlide());
        updateSlideUI();
        updateViewportTransform();
        requestAnimationFrame(animationLoop);
      }

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
